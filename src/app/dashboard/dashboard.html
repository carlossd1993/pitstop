<!-- Barra de navegación superior -->
<nav class="navbar navbar-expand bg-primary shadow-sm mb-4">
  <div class="container">
    <span class="navbar-brand text-white fw-bold fs-4 mb-0">Pitstop</span>
    <button class="btn btn-outline-light btn-sm fw-semibold px-3" (click)="onLogout()">
      Cerrar sesión
    </button>
  </div>
</nav>

<!-- Contenedor central -->
<main class="container pb-5">
  <!-- Fila con buscador amplio y botón de acento -->
  <div class="row g-3 align-items-center mb-4">
    <div class="col">
      <input
        type="text"
        class="form-control form-control-lg bg-white shadow-sm"
        placeholder="Buscar por cliente, marca o modelo..."
        aria-label="Buscar bicicletas"
      />
    </div>
    <div class="col-auto">
      <button class="btn btn-secondary btn-lg fw-semibold shadow-sm text-nowrap">
        + Nueva Bici
      </button>
    </div>
  </div>

  <!-- Grid de Bootstrap -->
  <div class="row g-4">
    <!-- Tarjeta de ejemplo estática -->
    <div class="col-md-4">
      <div class="card bg-white rounded shadow-sm border-0 h-100">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <h5 class="card-title fw-bold text-primary mb-1">Carlos Ruiz</h5>
              <span class="text-muted small">Cliente habitual</span>
            </div>
            <span class="badge bg-secondary text-dark rounded-pill px-3 py-2 fw-semibold">
              MTB
            </span>
          </div>

          <hr class="text-muted opacity-25 my-3" />

          <div class="d-flex flex-column gap-2">
            <div class="d-flex justify-content-between">
              <span class="text-muted small">Marca:</span>
              <span class="fw-semibold text-dark">Specialized</span>
            </div>
            <div class="d-flex justify-content-between">
              <span class="text-muted small">Modelo:</span>
              <span class="fw-semibold text-dark">Epic Expert Carbon</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
